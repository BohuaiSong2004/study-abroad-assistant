syntax = "proto3";

package waypoint.events.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// EventStream is implemented by every service that owns data. Each service
// writes its domain events to an outbox in its own DynamoDB table in the same
// transaction as the state change; Subscribe tails that outbox. Consumers keep
// their own cursor (last applied seq) and resume from it after a restart, so
// delivery is at-least-once and consumers must apply events idempotently.
service EventStreamService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Head(HeadRequest) returns (HeadResponse);
}

message SubscribeRequest {
  // Deliver events with seq > after_seq. Ignored when from_tail is true.
  int64 after_seq = 1;
  // Start at the current head: only events written after the call.
  bool from_tail = 2;
}

message SubscribeResponse {
  oneof kind {
    Event event = 1;
    Heartbeat heartbeat = 2;
  }
}

message Event {
  string stream = 1;
  int64 seq = 2;
  string type = 3;
  string aggregate_id = 4;
  google.protobuf.Any payload = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// Heartbeat lets consumers measure lag and detect dead streams.
message Heartbeat {
  int64 head_seq = 1;
  google.protobuf.Timestamp server_time = 2;
}

message HeadRequest {}

message HeadResponse {
  string stream = 1;
  int64 head_seq = 2;
}
