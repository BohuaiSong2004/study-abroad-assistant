# Full stack on DynamoDB Local:  docker compose up --build
# Then open http://localhost:8080 (counselor: counselor@example.com / counselor-demo-password).
# Invitation and password-reset emails land in Mailpit: http://localhost:8025.
# Services talk gRPC over mutual TLS with certificates from the certs job.
name: waypoint

x-service: &service
  restart: unless-stopped
  environment: &env
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    AWS_REGION: us-east-1
    TABLE_PREFIX: waypoint-
    CACHE_MODE: ${CACHE_MODE:-local}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-compose-internal-token}
    CATALOG_ADDR: dns:///catalog:9091
    APPLICATIONS_ADDR: dns:///applications:9092
    TIMELINE_ADDR: dns:///timeline:9093
    LOG_FORMAT: json
    GRPC_TLS_CA: /certs/ca.pem
  volumes: &certs ["certs:/certs:ro"]
  healthcheck: &health
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

volumes:
  certs:

services:
  # One-shot: a throwaway CA and a certificate per service (kept across
  # restarts in the certs volume).
  certs:
    build: { context: ., args: { SERVICE: devcerts } }
    command: ["-out", "/certs", "catalog", "applications", "timeline", "gateway", "seed", "waypointctl"]
    volumes: ["certs:/certs"]
    restart: "no"

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]
    restart: unless-stopped

  # Catches all outgoing email: inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["8025:8025"]
    restart: unless-stopped

  catalog:
    <<: *service
    build: { context: ., args: { SERVICE: catalog } }
    environment:
      <<: *env
      GRPC_ADDR: ":9091"
      ADMIN_ADDR: ":9101"
      GRPC_TLS_CERT: /certs/catalog.pem
      GRPC_TLS_KEY: /certs/catalog-key.pem
    depends_on:
      certs: { condition: service_completed_successfully }
      dynamodb: { condition: service_started }

  applications:
    <<: *service
    build: { context: ., args: { SERVICE: applications } }
    environment:
      <<: *env
      GRPC_ADDR: ":9092"
      ADMIN_ADDR: ":9102"
      GRPC_TLS_CERT: /certs/applications.pem
      GRPC_TLS_KEY: /certs/applications-key.pem
      BOOTSTRAP_COUNSELOR_EMAIL: ${BOOTSTRAP_COUNSELOR_EMAIL:-counselor@example.com}
      BOOTSTRAP_COUNSELOR_PASSWORD: ${BOOTSTRAP_COUNSELOR_PASSWORD:-counselor-demo-password}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MAIL_MODE: smtp
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: ${MAIL_FROM:-Waypoint <no-reply@waypoint.local>}
      # Shared limits stay on; the per-address thresholds allow repeated runs
      # of the e2e suite from one machine (production defaults: 60 sign-ins
      # per 10 min, 20 sign-ups per hour per address).
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-2000}
      REGISTER_LIMIT_PER_IP: ${REGISTER_LIMIT_PER_IP:-2000}
    depends_on:
      dynamodb: { condition: service_started }
      mailpit: { condition: service_started }
      catalog: { condition: service_healthy }

  timeline:
    <<: *service
    build: { context: ., args: { SERVICE: timeline } }
    environment:
      <<: *env
      GRPC_ADDR: ":9093"
      ADMIN_ADDR: ":9103"
      GRPC_TLS_CERT: /certs/timeline.pem
      GRPC_TLS_KEY: /certs/timeline-key.pem
      CONSUMER_WORKERS: ${CONSUMER_WORKERS:-8}
      REPLAN_PARALLELISM: ${REPLAN_PARALLELISM:-8}
    depends_on:
      catalog: { condition: service_healthy }
      applications: { condition: service_healthy }

  gateway:
    <<: *service
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      GRPC_TLS_CERT: /certs/gateway.pem
      GRPC_TLS_KEY: /certs/gateway-key.pem
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # The limiter stays on; the threshold allows the e2e suite's sign-ups.
      AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-300}
    ports: ["8080:8080"]
    depends_on:
      catalog: { condition: service_healthy }
      applications: { condition: service_healthy }
      timeline: { condition: service_healthy }

  seed:
    build: { context: ., args: { SERVICE: seed } }
    environment:
      <<: *env
      GRPC_TLS_CERT: /certs/seed.pem
      GRPC_TLS_KEY: /certs/seed-key.pem
    volumes: *certs
    depends_on:
      catalog: { condition: service_healthy }
    restart: "no"

  # Operator CLI (not started by `up`):
  #   docker compose run --rm ctl status
  #   docker compose run --rm ctl dlq list
  ctl:
    build: { context: ., args: { SERVICE: waypointctl } }
    environment:
      <<: *env
      GRPC_TLS_CERT: /certs/waypointctl.pem
      GRPC_TLS_KEY: /certs/waypointctl-key.pem
    volumes: *certs
    profiles: [tools]
    restart: "no"
