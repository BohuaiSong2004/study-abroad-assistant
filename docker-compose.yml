# Full stack on DynamoDB Local:  docker compose up --build
# Then open http://localhost:8080 (counselor: counselor@example.com / counselor-demo-password).
name: waypoint

x-service: &service
  restart: unless-stopped
  environment: &env
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    AWS_REGION: us-east-1
    TABLE_PREFIX: waypoint-
    CACHE_MODE: ${CACHE_MODE:-local}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN:-compose-internal-token}
    CATALOG_ADDR: dns:///catalog:9091
    APPLICATIONS_ADDR: dns:///applications:9092
    TIMELINE_ADDR: dns:///timeline:9093
    LOG_FORMAT: json
  healthcheck: &health
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]
    restart: unless-stopped

  catalog:
    <<: *service
    build: { context: ., args: { SERVICE: catalog } }
    environment:
      <<: *env
      GRPC_ADDR: ":9091"
      ADMIN_ADDR: ":9101"
    depends_on: [dynamodb]

  applications:
    <<: *service
    build: { context: ., args: { SERVICE: applications } }
    environment:
      <<: *env
      GRPC_ADDR: ":9092"
      ADMIN_ADDR: ":9102"
      BOOTSTRAP_COUNSELOR_EMAIL: ${BOOTSTRAP_COUNSELOR_EMAIL:-counselor@example.com}
      BOOTSTRAP_COUNSELOR_PASSWORD: ${BOOTSTRAP_COUNSELOR_PASSWORD:-counselor-demo-password}
      # Shared limits stay on; the per-address thresholds allow repeated runs
      # of the e2e suite from one machine (production defaults: 60 sign-ins
      # per 10 min, 20 sign-ups per hour per address).
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-2000}
      REGISTER_LIMIT_PER_IP: ${REGISTER_LIMIT_PER_IP:-2000}
    depends_on:
      dynamodb: { condition: service_started }
      catalog: { condition: service_healthy }

  timeline:
    <<: *service
    build: { context: ., args: { SERVICE: timeline } }
    environment:
      <<: *env
      GRPC_ADDR: ":9093"
      ADMIN_ADDR: ":9103"
      CONSUMER_WORKERS: ${CONSUMER_WORKERS:-8}
      REPLAN_PARALLELISM: ${REPLAN_PARALLELISM:-8}
    depends_on:
      catalog: { condition: service_healthy }
      applications: { condition: service_healthy }

  gateway:
    <<: *service
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
      ADMIN_ADDR: ":8081"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # The limiter stays on; the threshold allows the e2e suite's sign-ups.
      AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-300}
    ports: ["8080:8080"]
    depends_on:
      catalog: { condition: service_healthy }
      applications: { condition: service_healthy }
      timeline: { condition: service_healthy }

  seed:
    build: { context: ., args: { SERVICE: seed } }
    environment:
      <<: *env
    depends_on:
      catalog: { condition: service_healthy }
    restart: "no"

  # Operator CLI (not started by `up`):
  #   docker compose run --rm ctl status
  #   docker compose run --rm ctl dlq list
  ctl:
    build: { context: ., args: { SERVICE: waypointctl } }
    environment:
      <<: *env
    profiles: [tools]
    restart: "no"
