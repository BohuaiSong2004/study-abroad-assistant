<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n>Programs · Waypoint</title>
<meta name="description" content="Search graduate and undergraduate programs, their deadlines and requirements.">
<meta name="theme-color" content="#0b6e65">
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
<script defer src="/vendor/jquery-3.7.1.min.js"></script>
<script defer src="/js/i18n-zh.js"></script>
<script defer src="/js/common.js"></script>
<script defer src="/js/programs.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n>Skip to content</a>
<header class="site-header">
  <div class="bar">
    <a class="brand" href="/"><img src="/img/logo.svg" alt="" width="28" height="28"> Waypoint</a>
    <nav id="site-nav" class="site-nav" aria-label="Main" data-i18n-attr="aria-label"></nav>
    <div id="user-menu" class="user-menu"></div>
  </div>
</header>
<main id="main">
<div class="page-head">
  <div>
    <h1 data-i18n>Programs</h1>
    <p class="subtitle" data-i18n>Search the catalog and start tracking an application.</p>
  </div>
</div>
<form class="card" id="search-form" role="search" method="get" action="/programs.html">
  <div class="row">
    <div class="field grow-2">
      <label for="q" data-i18n>Search</label>
      <input id="q" name="q" type="search" placeholder="University, program or field" maxlength="100" data-i18n-attr="placeholder">
    </div>
    <div class="field">
      <label for="country" data-i18n>Country</label>
      <select id="country" name="country"><option value="" data-i18n>Any</option></select>
    </div>
    <div class="field">
      <label for="degree" data-i18n>Degree</label>
      <select id="degree" name="degree">
        <option value="" data-i18n>Any</option><option value="bachelor" data-i18n>Bachelor's</option><option value="master" data-i18n>Master's</option><option value="phd" data-i18n>PhD</option><option value="mba" data-i18n>MBA</option>
      </select>
    </div>
    <div class="field">
      <label for="field" data-i18n>Field</label>
      <select id="field" name="field"><option value="" data-i18n>Any</option></select>
    </div>
    <div class="field no-grow">
      <button class="btn" type="submit" data-i18n>Search</button>
    </div>
  </div>
</form>
<p class="muted small" id="result-count" aria-live="polite"></p>
<ul class="results" id="results" aria-busy="true"></ul>
<div class="actions center mt-1">
  <button class="btn secondary" type="button" id="more" hidden data-i18n>Load more</button>
</div>
<dialog id="apply-dialog" aria-labelledby="apply-title">
  <form id="apply-form" method="dialog">
    <h2 id="apply-title" data-i18n>Start application</h2>
    <p class="muted" id="apply-program"></p>
    <p class="form-error" role="alert" id="apply-error"></p>
    <fieldset>
      <legend data-i18n>Which round will you apply in?</legend>
      <div class="radio-list" id="apply-rounds"></div>
    </fieldset>
    <div class="actions">
      <button class="btn" type="submit" id="apply-submit" data-i18n>Start application</button>
      <button class="btn secondary" type="button" id="apply-cancel" data-i18n>Cancel</button>
    </div>
  </form>
</dialog>
</main>
<footer class="site-footer" data-i18n>
  Waypoint is a portfolio project. The program catalog is sample data &mdash; always confirm deadlines on each program's official website.
</footer>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
